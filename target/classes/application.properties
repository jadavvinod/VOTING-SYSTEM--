spring.application.name=college-voting-system

# ===== Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/college_voting?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Svavram@951
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
# 32+ char secret required for HS256. Override via env var in production.
app.jwt.secret=${JWT_SECRET:ChangeThisSecretKeyToSomethingLongAndRandom123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== Mail (optional, used later for OTP/notifications) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== Server =====
server.port=${SERVER_PORT:8080}

# ===== File uploads (candidate photos) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
