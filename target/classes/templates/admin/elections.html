<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Elections | Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --dark: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f5f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: #1f2937;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 250px;
            background: #111827;
            padding: 24px 16px;
            z-index: 1000;
        }

        .brand {
            color: white;
            font-size: 21px;
            font-weight: 700;
            padding: 10px 14px 25px;
            border-bottom: 1px solid rgba(255,255,255,.1);
            margin-bottom: 20px;
        }

        .brand span {
            color: #818cf8;
        }

        .nav-link-custom {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 6px;
            transition: .2s;
        }

        .nav-link-custom:hover,
        .nav-link-custom.active {
            background: #312e81;
            color: white;
        }

        .main {
            margin-left: 250px;
            min-height: 100vh;
        }

        .topbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
        }

        .page-content {
            padding: 30px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .page-subtitle {
            color: var(--muted);
            margin-top: 5px;
        }

        .btn-primary-custom {
            background: var(--primary);
            border: none;
            color: white;
            border-radius: 10px;
            padding: 11px 18px;
            font-weight: 600;
        }

        .btn-primary-custom:hover {
            background: var(--primary-dark);
            color: white;
        }

        .stat-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            height: 100%;
            box-shadow: 0 3px 12px rgba(0,0,0,.03);
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        .stat-number {
            font-size: 27px;
            font-weight: 700;
            margin-top: 6px;
        }

        .filter-box {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 18px;
            margin: 25px 0;
        }

        .election-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 22px;
            height: 100%;
            transition: .2s;
            box-shadow: 0 3px 15px rgba(0,0,0,.03);
        }

        .election-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
        }

        .election-title {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .election-description {
            color: var(--muted);
            font-size: 14px;
            min-height: 42px;
        }

        .date-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }

        .date-row:last-child {
            border-bottom: none;
        }

        .date-label {
            color: var(--muted);
        }

        .status {
            display: inline-flex;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-upcoming {
            background: #eef2ff;
            color: #4338ca;
        }

        .status-active {
            background: #dcfce7;
            color: #15803d;
        }

        .status-completed {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #b91c1c;
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            margin: 30px 0 15px;
        }

        .empty-box {
            background: white;
            border: 1px dashed #cbd5e1;
            border-radius: 15px;
            padding: 35px;
            text-align: center;
            color: var(--muted);
        }

        .action-btn {
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .danger-btn {
            color: #dc2626;
            border-color: #fecaca;
        }

        .danger-btn:hover {
            background: #fee2e2;
            color: #b91c1c;
        }

        .modal-content {
            border: none;
            border-radius: 17px;
            overflow: hidden;
        }

        .modal-header {
            background: #111827;
            color: white;
        }

        .form-control,
        .form-select {
            border-radius: 9px;
            padding: 10px 12px;
            border-color: #d1d5db;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,.12);
        }

        @media(max-width: 900px) {
            .sidebar {
                width: 70px;
                padding: 15px 8px;
            }

            .brand {
                font-size: 0;
                text-align: center;
            }

            .brand span {
                font-size: 22px;
            }

            .nav-link-custom span {
                display: none;
            }

            .nav-link-custom {
                justify-content: center;
            }

            .main {
                margin-left: 70px;
            }
        }

        @media(max-width: 600px) {
            .topbar {
                padding: 0 15px;
            }

            .page-content {
                padding: 18px;
            }

            .page-title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="brand">
        College <span>Voting</span>
    </div>

    <a href="/admin/dashboard" class="nav-link-custom">
        <span>📊</span>
        <span>Dashboard</span>
    </a>

    <a href="/admin/elections" class="nav-link-custom active">
        <span>🗳️</span>
        <span>Elections</span>
    </a>

    <a href="/admin/students" class="nav-link-custom">
        <span>👨‍🎓</span>
        <span>Students</span>
    </a>

    <a href="/admin/candidates" class="nav-link-custom">
        <span>👥</span>
        <span>Candidates</span>
    </a>

    <a href="/admin/results" class="nav-link-custom">
        <span>📈</span>
        <span>Results</span>
    </a>

    <a href="/admin/audit-logs" class="nav-link-custom">
        <span>📋</span>
        <span>Audit Logs</span>
    </a>

    <div style="position:absolute;bottom:20px;left:16px;right:16px;">
        <button class="btn btn-outline-light w-100" onclick="logout()">
            Logout
        </button>
    </div>
</aside>

<!-- MAIN -->
<main class="main">

    <header class="topbar">
        <div>
            <strong>Election Management</strong>
        </div>

        <div class="text-muted small">
            Administrator
        </div>
    </header>

    <div class="page-content">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1 class="page-title">Manage Elections</h1>
                <div class="page-subtitle">
                    Create, monitor and manage college elections.
                </div>
            </div>

            <button
                    class="btn btn-primary-custom"
                    data-bs-toggle="modal"
                    data-bs-target="#createElectionModal">
                + Create Election
            </button>
        </div>

        <div id="alertBox" class="alert d-none mt-4"></div>

        <!-- STATISTICS -->
        <div class="row g-3 mt-3">

            <div class="col-lg-3 col-md-6">
                <div class="stat-card">
                    <div class="stat-label">TOTAL ELECTIONS</div>
                    <div class="stat-number" id="totalCount">0</div>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="stat-card">
                    <div class="stat-label">UPCOMING</div>
                    <div class="stat-number text-primary" id="upcomingCount">0</div>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="stat-card">
                    <div class="stat-label">ACTIVE</div>
                    <div class="stat-number text-success" id="activeCount">0</div>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="stat-card">
                    <div class="stat-label">COMPLETED</div>
                    <div class="stat-number text-secondary" id="completedCount">0</div>
                </div>
            </div>

        </div>

        <!-- FILTER -->
        <div class="filter-box">

            <div class="row g-2">

                <div class="col-md-6">
                    <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="🔍 Search election name...">
                </div>

                <div class="col-md-3">
                    <select id="statusFilter" class="form-select">
                        <option value="">All Statuses</option>
                        <option value="UPCOMING">Upcoming</option>
                        <option value="ACTIVE">Active</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <button
                            class="btn btn-outline-secondary w-100"
                            onclick="resetFilters()">
                        Reset Filters
                    </button>
                </div>

            </div>

        </div>

        <!-- ELECTIONS -->
        <div id="electionsList"></div>

    </div>
</main>

<!-- CREATE MODAL -->
<div class="modal fade" id="createElectionModal" tabindex="-1">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">
                <div>
                    <h5 class="modal-title mb-1">Create New Election</h5>
                    <small class="opacity-75">
                        Enter election information below
                    </small>
                </div>

                <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body p-4">

                <form id="electionForm">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Election Name
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                id="name"
                                placeholder="e.g. Student Council Election"
                                required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Description
                        </label>

                        <textarea
                                class="form-control"
                                id="description"
                                rows="2"
                                placeholder="Brief description of the election">
                        </textarea>
                    </div>

                    <div class="row">

                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">
                                Academic Year
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    id="academicYear"
                                    placeholder="2026-2027">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">
                                Start Date & Time
                            </label>

                            <input
                                    type="datetime-local"
                                    class="form-control"
                                    id="startDateTime"
                                    required>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">
                                End Date & Time
                            </label>

                            <input
                                    type="datetime-local"
                                    class="form-control"
                                    id="endDateTime"
                                    required>
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Election Rules
                        </label>

                        <textarea
                                class="form-control"
                                id="rules"
                                rows="3"
                                placeholder="Enter voting rules...">
                        </textarea>
                    </div>

                    <div class="form-check mb-4">
                        <input
                                class="form-check-input"
                                type="checkbox"
                                id="showLiveResults">

                        <label
                                class="form-check-label"
                                for="showLiveResults">
                            Show live results while voting is active
                        </label>
                    </div>

                    <button
                            type="submit"
                            class="btn btn-primary-custom w-100">
                        Create Election
                    </button>

                </form>

            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>

<script>

requireAuth('ROLE_ADMIN');

let allElections = [];

function showAlert(message, type) {

    const box = document.getElementById('alertBox');

    box.textContent = message;

    box.className = 'alert alert-' + type + ' mt-4';

    setTimeout(() => {
        box.className = 'alert d-none';
    }, 4000);
}

function statusBadge(status) {

    const classes = {
        UPCOMING: 'status-upcoming',
        ACTIVE: 'status-active',
        COMPLETED: 'status-completed',
        CANCELLED: 'status-cancelled'
    };

    const names = {
        UPCOMING: 'Upcoming',
        ACTIVE: 'Active',
        COMPLETED: 'Completed',
        CANCELLED: 'Cancelled'
    };

    return `
        <span class="status ${classes[status] || ''}">
            ${names[status] || status}
        </span>
    `;
}

function renderElections() {

    const search =
        document.getElementById('searchInput').value
            .toLowerCase()
            .trim();

    const status =
        document.getElementById('statusFilter').value;

    const filtered = allElections.filter(e => {

        const matchesSearch =
            !search ||
            (e.name || '').toLowerCase().includes(search);

        const matchesStatus =
            !status ||
            e.status === status;

        return matchesSearch && matchesStatus;
    });

    const container =
        document.getElementById('electionsList');

    container.innerHTML = '';

    if (filtered.length === 0) {

        container.innerHTML = `
            <div class="empty-box">
                <div style="font-size:40px;">🗳️</div>
                <h5 class="mt-3">No elections found</h5>
                <p class="mb-0">
                    Try changing your search or filter.
                </p>
            </div>
        `;

        return;
    }

    const groups = [
        {
            status: 'ACTIVE',
            title: 'Active Elections'
        },
        {
            status: 'UPCOMING',
            title: 'Upcoming Elections'
        },
        {
            status: 'COMPLETED',
            title: 'Completed Elections'
        },
        {
            status: 'CANCELLED',
            title: 'Cancelled Elections'
        }
    ];

    groups.forEach(group => {

        const elections =
            filtered.filter(e => e.status === group.status);

        if (elections.length === 0) return;

        const section = document.createElement('div');

        section.innerHTML = `
            <div class="section-title">
                ${group.title}
                <span class="text-muted fw-normal">
                    (${elections.length})
                </span>
            </div>

            <div class="row g-4" id="group-${group.status}"></div>
        `;

        container.appendChild(section);

        const row =
            section.querySelector(`#group-${group.status}`);

        elections.forEach(e => {

            const col = document.createElement('div');

            col.className = 'col-xl-4 col-lg-6';

            col.innerHTML = `
                <div class="election-card">

                    <div class="d-flex justify-content-between align-items-start gap-2 mb-3">

                        <div>
                            <div class="election-title">
                                ${escapeHtml(e.name)}
                            </div>

                            <small class="text-muted">
                                Academic Year:
                                ${escapeHtml(e.academicYear || 'N/A')}
                            </small>
                        </div>

                        ${statusBadge(e.status)}

                    </div>

                    <div class="election-description mb-3">
                        ${escapeHtml(e.description || 'No description provided.')}
                    </div>

                    <div class="date-row">
                        <span class="date-label">Start</span>
                        <strong>
                            ${formatDate(e.startDateTime)}
                        </strong>
                    </div>

                    <div class="date-row mb-3">
                        <span class="date-label">End</span>
                        <strong>
                            ${formatDate(e.endDateTime)}
                        </strong>
                    </div>

                    <div class="d-flex flex-wrap gap-2">

                        ${
                            e.status === 'UPCOMING'
                            ? `
                                <button
                                    class="btn btn-sm btn-success action-btn"
                                    onclick="startElection(${e.id})">
                                    ▶ Start
                                </button>
                            `
                            : ''
                        }

                        ${
                            e.status === 'ACTIVE'
                            ? `
                                <button
                                    class="btn btn-sm btn-primary action-btn"
                                    onclick="closeElection(${e.id})">
                                    ✓ Close
                                </button>
                            `
                            : ''
                        }

                        ${
                            e.status !== 'CANCELLED' &&
                            e.status !== 'COMPLETED'
                            ? `
                                <button
                                    class="btn btn-sm btn-outline-danger action-btn"
                                    onclick="cancelElection(${e.id})">
                                    Cancel
                                </button>
                            `
                            : ''
                        }

                        ${
                            e.status === 'COMPLETED' ||
                            e.status === 'CANCELLED'
                            ? `
                                <button
                                    class="btn btn-sm btn-outline-danger danger-btn action-btn"
                                    onclick="deleteElection(${e.id}, '${escapeForJs(e.name)}')">
                                    🗑 Delete
                                </button>
                            `
                            : ''
                        }

                    </div>

                </div>
            `;

            row.appendChild(col);
        });
    });
}

function formatDate(value) {

    if (!value) return 'N/A';

    return new Date(value).toLocaleString([], {
        dateStyle: 'medium',
        timeStyle: 'short'
    });
}

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function escapeForJs(value) {

    return String(value)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"');
}

async function loadElections() {

    const res =
        await authFetch('/api/admin/elections');

    if (!res) return;

    if (!res.ok) {

        showAlert(
            'Failed to load elections.',
            'danger'
        );

        return;
    }

    allElections = await res.json();

    updateStats();

    renderElections();
}

function updateStats() {

    document.getElementById('totalCount').textContent =
        allElections.length;

    document.getElementById('upcomingCount').textContent =
        allElections.filter(e => e.status === 'UPCOMING').length;

    document.getElementById('activeCount').textContent =
        allElections.filter(e => e.status === 'ACTIVE').length;

    document.getElementById('completedCount').textContent =
        allElections.filter(e => e.status === 'COMPLETED').length;
}

async function startElection(id) {

    const confirmed =
        confirm('Start this election now?');

    if (!confirmed) return;

    const res =
        await authFetch(
            `/api/admin/elections/${id}/start`,
            { method: 'PATCH' }
        );

    if (res && res.ok) {

        showAlert(
            'Election started successfully.',
            'success'
        );

        loadElections();

    } else {

        showAlert(
            'Failed to start election.',
            'danger'
        );
    }
}

async function closeElection(id) {

    const confirmed =
        confirm('Close this election? Voting will stop.');

    if (!confirmed) return;

    const res =
        await authFetch(
            `/api/admin/elections/${id}/close`,
            { method: 'PATCH' }
        );

    if (res && res.ok) {

        showAlert(
            'Election completed successfully.',
            'success'
        );

        loadElections();

    } else {

        showAlert(
            'Failed to close election.',
            'danger'
        );
    }
}

async function cancelElection(id) {

    const confirmed =
        confirm(
            'Cancel this election?\n\nThis action cannot be undone.'
        );

    if (!confirmed) return;

    const res =
        await authFetch(
            `/api/admin/elections/${id}/cancel`,
            { method: 'PATCH' }
        );

    if (res && res.ok) {

        showAlert(
            'Election cancelled successfully.',
            'success'
        );

        loadElections();

    } else {

        showAlert(
            'Failed to cancel election.',
            'danger'
        );
    }
}

async function deleteElection(id, name) {

    const confirmed =
        confirm(
            `Delete "${name}" permanently?\n\n` +
            'This election will be removed from the system.\n\n' +
            'Click OK to permanently delete it.'
        );

    if (!confirmed) return;

    try {

        const res =
            await authFetch(
                `/api/admin/elections/${id}`,
                {
                    method: 'DELETE'
                }
            );

        if (res && res.ok) {

            showAlert(
                'Election deleted successfully.',
                'success'
            );

            await loadElections();

        } else {

            let message =
                'Failed to delete election.';

            try {

                const data =
                    await res.json();

                message =
                    data.message || message;

            } catch (error) {}

            showAlert(message, 'danger');
        }

    } catch (error) {

        console.error(error);

        showAlert(
            'Server error while deleting election.',
            'danger'
        );
    }
}

document
    .getElementById('searchInput')
    .addEventListener('input', renderElections);

document
    .getElementById('statusFilter')
    .addEventListener('change', renderElections);

function resetFilters() {

    document.getElementById('searchInput').value = '';

    document.getElementById('statusFilter').value = '';

    renderElections();
}

document
    .getElementById('electionForm')
    .addEventListener('submit', async function(e) {

        e.preventDefault();

        const body = {

            name:
                document.getElementById('name').value.trim(),

            description:
                document.getElementById('description').value.trim(),

            academicYear:
                document.getElementById('academicYear').value.trim(),

            startDateTime:
                document.getElementById('startDateTime').value,

            endDateTime:
                document.getElementById('endDateTime').value,

            rules:
                document.getElementById('rules').value.trim(),

            showLiveResults:
                document.getElementById('showLiveResults').checked
        };

        if (
            new Date(body.endDateTime) <=
            new Date(body.startDateTime)
        ) {

            showAlert(
                'End date/time must be after start date/time.',
                'danger'
            );

            return;
        }

        const res =
            await authFetch(
                '/api/admin/elections',
                {
                    method: 'POST',
                    body: JSON.stringify(body)
                }
            );

        if (!res) return;

        let data = {};

        try {
            data = await res.json();
        } catch (error) {}

        if (!res.ok) {

            showAlert(
                data.message ||
                'Failed to create election.',
                'danger'
            );

            return;
        }

        showAlert(
            'Election created successfully.',
            'success'
        );

        bootstrap.Modal
            .getInstance(
                document.getElementById('createElectionModal')
            )
            .hide();

        document
            .getElementById('electionForm')
            .reset();

        loadElections();
    });

loadElections();

</script>

</body>
</html>
