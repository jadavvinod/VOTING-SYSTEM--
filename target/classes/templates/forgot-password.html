<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="card shadow-sm" style="width: 400px;">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Forgot Password</h3>
            <div id="alertBox" class="alert d-none"></div>
            <form id="forgotForm">
                <div class="mb-3">
                    <label class="form-label">College Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="submitBtn">Send Reset Code</button>
            </form>
            <p class="text-center mt-3 mb-0"><a href="/login">Back to login</a></p>
        </div>
    </div>
</div>

<script>
document.getElementById('forgotForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
        const email = document.getElementById('email').value;
        const response = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Something went wrong');

        alertBox.className = 'alert alert-success';
        let msg = data.message;
        if (data.devOnlyOtp) {
            msg += ' (Dev mode — no email is configured, so here is your code: ' + data.devOnlyOtp + ')';
        }
        alertBox.textContent = msg;
        alertBox.classList.remove('d-none');

        setTimeout(() => {
            window.location.href = '/reset-password?email=' + encodeURIComponent(email);
        }, 2000);
    } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = err.message;
        alertBox.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Send Reset Code';
    }
});
</script>
</body>
</html>
