<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | College Voting</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #172033;
        }

        /* =========================
           NAVBAR
        ========================= */

        .topbar {
            background: linear-gradient(135deg, #4f46e5, #2563eb);
            min-height: 72px;
            box-shadow: 0 5px 20px rgba(37, 99, 235, .18);
        }

        .brand {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
        }

        .brand:hover {
            color: white;
        }

        .brand-icon {
            display: inline-flex;
            width: 42px;
            height: 42px;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,.18);
            border-radius: 12px;
            margin-right: 10px;
        }

        /* =========================
           PROFILE
        ========================= */

        .profile-wrapper {
            position: relative;
        }

        .profile-button {
            width: 46px;
            height: 46px;
            padding: 0;
            border: 2px solid rgba(255,255,255,.75);
            border-radius: 50%;
            background: rgba(255,255,255,.18);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: .25s;
        }

        .profile-button:hover {
            background: white;
            color: #2563eb;
            transform: scale(1.04);
        }

        .profile-button img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-button i {
            font-size: 23px;
        }

        .profile-menu {
            min-width: 290px;
            padding: 0;
            margin-top: 10px;
            border: none;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(15,23,42,.16);
        }

        .profile-header {
            padding: 18px;
            background: linear-gradient(135deg, #eef2ff, #eff6ff);
            border-bottom: 1px solid #e5eaf2;
        }

        .profile-header-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-large {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #4f46e5;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .profile-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-large i {
            font-size: 24px;
        }

        .profile-name {
            font-weight: 700;
            font-size: 15px;
            color: #172033;
            margin-bottom: 3px;
        }

        .profile-email {
            font-size: 12px;
            color: #64748b;
            word-break: break-word;
        }

        .profile-menu .dropdown-item {
            padding: 12px 18px;
            font-size: 14px;
            color: #334155;
        }

        .profile-menu .dropdown-item i {
            width: 25px;
            font-size: 16px;
        }

        .profile-menu .dropdown-item:hover {
            background: #f1f5ff;
            color: #4f46e5;
        }

        .profile-menu .logout-item {
            color: #dc3545;
        }

        .profile-menu .logout-item:hover {
            background: #fff1f2;
            color: #dc3545;
        }

        /* =========================
           PASSWORD PAGE
        ========================= */

        .password-wrapper {
            max-width: 520px;
            margin: 55px auto;
        }

        .password-card {
            background: white;
            border: 1px solid #e5eaf2;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(15,23,42,.08);
        }

        .page-icon {
            width: 65px;
            height: 65px;
            border-radius: 18px;
            background: #eef2ff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .password-card h2 {
            font-weight: 750;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .form-control {
            min-height: 48px;
            border-radius: 11px;
            border: 1px solid #dbe1ea;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99,102,241,.12);
        }

        .change-btn {
            min-height: 50px;
            border-radius: 12px;
            font-weight: 650;
        }

        .back-link {
            text-decoration: none;
            color: #64748b;
        }

        .back-link:hover {
            color: #4f46e5;
        }

        /* =========================
           MOBILE
        ========================= */

        @media(max-width:576px) {

            .topbar {
                min-height: 65px;
            }

            .brand {
                font-size: 16px;
            }

            .brand-icon {
                width: 37px;
                height: 37px;
                border-radius: 10px;
                margin-right: 6px;
            }

            .profile-button {
                width: 42px;
                height: 42px;
            }

            .profile-menu {
                min-width: 270px;
                right: 0;
            }

            .password-wrapper {
                margin: 25px auto;
            }

            .password-card {
                padding: 25px;
                border-radius: 20px;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar topbar">
    <div class="container d-flex justify-content-between align-items-center">

        <!-- Brand -->
        <a class="brand" href="/student/dashboard">

            <span class="brand-icon">
                <i class="bi bi-check2-square"></i>
            </span>

            Student Council Voting

        </a>


        <!-- Profile -->
        <div class="profile-wrapper dropdown">

            <button
                class="profile-button"
                type="button"
                id="profileDropdown"
                data-bs-toggle="dropdown"
                aria-expanded="false">

                <img
                    id="navbarProfileImage"
                    src=""
                    alt="Profile"
                    class="d-none">

                <i
                    id="navbarProfileIcon"
                    class="bi bi-person">
                </i>

            </button>


            <!-- Profile Dropdown -->

            <div
                class="dropdown-menu dropdown-menu-end profile-menu"
                aria-labelledby="profileDropdown">

                <!-- Profile Information -->

                <div class="profile-header">

                    <div class="profile-header-content">

                        <div class="profile-large">

                            <img
                                id="dropdownProfileImage"
                                src=""
                                alt="Profile"
                                class="d-none">

                            <i
                                id="dropdownProfileIcon"
                                class="bi bi-person">
                            </i>

                        </div>


                        <div>

                            <div
                                class="profile-name"
                                id="profileName">
                                Student
                            </div>

                            <div
                                class="profile-email"
                                id="profileEmail">
                                Loading email...
                            </div>

                        </div>

                    </div>

                </div>


                <!-- Edit Profile -->

                <a
                    class="dropdown-item"
                    href="/student/profile">

                    <i class="bi bi-person-gear"></i>
                    Edit Profile

                </a>


                <!-- Registered Email -->

                <div class="dropdown-item">

                    <i class="bi bi-envelope"></i>

                    <span id="registeredEmail">
                        Loading...
                    </span>

                </div>


                <div class="dropdown-divider"></div>


                <!-- Change Password -->

                <a
                    class="dropdown-item"
                    href="/student/change-password">

                    <i class="bi bi-shield-lock"></i>
                    Change Password

                </a>


                <!-- Logout -->

                <button
                    type="button"
                    class="dropdown-item logout-item"
                    onclick="logout()">

                    <i class="bi bi-box-arrow-right"></i>
                    Logout

                </button>

            </div>

        </div>

    </div>
</nav>


<!-- =========================
     MAIN CONTENT
========================= -->

<div class="container">

    <div class="password-wrapper">

        <div class="password-card">

            <!-- Icon -->

            <div class="page-icon">

                <i class="bi bi-shield-lock"></i>

            </div>


            <!-- Heading -->

            <h2>
                Change Password
            </h2>

            <p class="subtitle mb-4">
                Update your password to keep your account secure.
            </p>


            <!-- Alert -->

            <div
                id="alertBox"
                class="alert d-none">
            </div>


            <!-- Password Form -->

            <form id="changePasswordForm">

                <!-- Current Password -->

                <div class="mb-3">

                    <label class="form-label">
                        Current Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="currentPassword"
                        placeholder="Enter current password"
                        required>

                </div>


                <!-- New Password -->

                <div class="mb-3">

                    <label class="form-label">
                        New Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="newPassword"
                        placeholder="Enter new password"
                        required
                        minlength="8">

                </div>


                <!-- Confirm Password -->

                <div class="mb-4">

                    <label class="form-label">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirmNewPassword"
                        placeholder="Confirm new password"
                        required
                        minlength="8">

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="btn btn-primary w-100 change-btn"
                    id="changeBtn">

                    <i class="bi bi-check-circle me-1"></i>
                    Change Password

                </button>

            </form>


            <!-- Back -->

            <div class="text-center mt-4">

                <a
                    href="/student/dashboard"
                    class="back-link">

                    <i class="bi bi-arrow-left"></i>
                    Back to Dashboard

                </a>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Authentication -->

<script src="/js/auth.js"></script>


<script>

requireAuth('ROLE_STUDENT');


/* =====================================
   LOAD PROFILE INFORMATION
===================================== */

const fullName =
    localStorage.getItem('fullName') || 'Student';

const email =
    localStorage.getItem('email') ||
    localStorage.getItem('registeredEmail') ||
    localStorage.getItem('collegeEmail') ||
    '';


document.getElementById('profileName').textContent =
    fullName;

document.getElementById('profileEmail').textContent =
    email || 'Registered student';

document.getElementById('registeredEmail').textContent =
    email || 'Email not available';


/* =====================================
   LOAD PROFILE IMAGE
===================================== */

const savedProfileImage =
    localStorage.getItem('profileImage');


if (savedProfileImage) {

    const navbarImage =
        document.getElementById('navbarProfileImage');

    const navbarIcon =
        document.getElementById('navbarProfileIcon');

    const dropdownImage =
        document.getElementById('dropdownProfileImage');

    const dropdownIcon =
        document.getElementById('dropdownProfileIcon');


    navbarImage.src = savedProfileImage;
    navbarImage.classList.remove('d-none');

    navbarIcon.classList.add('d-none');


    dropdownImage.src = savedProfileImage;
    dropdownImage.classList.remove('d-none');

    dropdownIcon.classList.add('d-none');
}


/* =====================================
   CHANGE PASSWORD
===================================== */

document
.getElementById('changePasswordForm')
.addEventListener('submit', async function(e) {

    e.preventDefault();


    const alertBox =
        document.getElementById('alertBox');

    const btn =
        document.getElementById('changeBtn');


    const currentPassword =
        document.getElementById('currentPassword').value.trim();

    const newPassword =
        document.getElementById('newPassword').value.trim();

    const confirmNewPassword =
        document.getElementById('confirmNewPassword').value.trim();


    /* Password confirmation */

    if (newPassword !== confirmNewPassword) {

        alertBox.className =
            'alert alert-danger';

        alertBox.innerHTML =
            '<i class="bi bi-exclamation-circle me-2"></i>' +
            'New password and confirm password do not match.';

        alertBox.classList.remove('d-none');

        return;
    }


    /* Minimum password length */

    if (newPassword.length < 8) {

        alertBox.className =
            'alert alert-danger';

        alertBox.innerHTML =
            '<i class="bi bi-exclamation-circle me-2"></i>' +
            'New password must contain at least 8 characters.';

        alertBox.classList.remove('d-none');

        return;
    }


    /* Disable button */

    btn.disabled = true;

    btn.innerHTML =
        '<span class="spinner-border spinner-border-sm me-2"></span>' +
        'Updating...';


    try {

        const res = await authFetch(
            '/api/student/profile/change-password',
            {
                method: 'PUT',

                body: JSON.stringify({

                    currentPassword:
                        currentPassword,

                    newPassword:
                        newPassword,

                    confirmNewPassword:
                        confirmNewPassword

                })
            }
        );


        if (!res) {

            btn.disabled = false;

            btn.innerHTML =
                '<i class="bi bi-check-circle me-1"></i>' +
                'Change Password';

            return;
        }


        const data =
            await res.json();


        /* Error */

        if (!res.ok) {

            alertBox.className =
                'alert alert-danger';

            alertBox.innerHTML =
                '<i class="bi bi-exclamation-circle me-2"></i>' +
                (data.message ||
                 'Failed to change password.');

            alertBox.classList.remove('d-none');


            btn.disabled = false;

            btn.innerHTML =
                '<i class="bi bi-check-circle me-1"></i>' +
                'Change Password';

            return;
        }


        /* Success */

        alertBox.className =
            'alert alert-success';

        alertBox.innerHTML =
            '<i class="bi bi-check-circle me-2"></i>' +
            (data.message ||
             'Password changed successfully.');

        alertBox.classList.remove('d-none');


        document
            .getElementById('changePasswordForm')
            .reset();


        btn.disabled = false;

        btn.innerHTML =
            '<i class="bi bi-check-circle me-1"></i>' +
            'Change Password';

    } catch (error) {

        console.error(error);


        alertBox.className =
            'alert alert-danger';

        alertBox.innerHTML =
            '<i class="bi bi-exclamation-circle me-2"></i>' +
            'Something went wrong. Please try again.';

        alertBox.classList.remove('d-none');


        btn.disabled = false;

        btn.innerHTML =
            '<i class="bi bi-check-circle me-1"></i>' +
            'Change Password';
    }

});

</script>

</body>
</html>
