<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Election Details | College Voting</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f6f8fc;
            color: #172033;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        /* =====================================
           NAVBAR
        ===================================== */

        .topbar {
            min-height: 76px;
            background: linear-gradient(
                135deg,
                #4f46e5,
                #2563eb
            );
            box-shadow:
                0 8px 25px rgba(37, 99, 235, .20);
        }

        .brand {
            display: flex;
            align-items: center;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: 750;
        }

        .brand:hover {
            color: white;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 11px;
            border-radius: 13px;
            background: rgba(255,255,255,.18);
            border: 1px solid rgba(255,255,255,.25);
            font-size: 22px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            color: white;
            border: 1px solid rgba(255,255,255,.45);
            border-radius: 11px;
            padding: 9px 14px;
            font-weight: 600;
            transition: .2s;
        }

        .nav-btn:hover {
            color: #2563eb;
            background: white;
        }

        /* =====================================
           MAIN
        ===================================== */

        .main-container {
            max-width: 1180px;
            margin: auto;
            padding-bottom: 55px;
        }

        /* =====================================
           BACK BUTTON
        ===================================== */

        .back-row {
            margin-top: 25px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #475569;
            text-decoration: none;
            font-size: 14px;
            font-weight: 650;
        }

        .back-btn:hover {
            color: #4f46e5;
        }

        /* =====================================
           ELECTION HERO
        ===================================== */

        .election-header {
            position: relative;
            overflow: hidden;
            margin-top: 18px;
            padding: 38px;
            border-radius: 26px;
            color: white;
            background:
                linear-gradient(
                    135deg,
                    #4338ca,
                    #2563eb
                );
            box-shadow:
                0 18px 42px rgba(37,99,235,.20);
        }

        .election-header::before {
            content: "";
            position: absolute;
            width: 290px;
            height: 290px;
            right: -90px;
            top: -140px;
            border-radius: 50%;
            background: rgba(255,255,255,.09);
        }

        .election-header::after {
            content: "";
            position: absolute;
            width: 160px;
            height: 160px;
            right: 170px;
            bottom: -100px;
            border-radius: 50%;
            background: rgba(255,255,255,.06);
        }

        .header-content {
            position: relative;
            z-index: 2;
        }

        .election-icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            border-radius: 17px;
            background: rgba(255,255,255,.16);
            border: 1px solid rgba(255,255,255,.20);
            font-size: 27px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            margin-bottom: 14px;
            border-radius: 20px;
            background: white;
            color: #2563eb;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .3px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
        }

        .status-dot.upcoming {
            background: #f59e0b;
        }

        .status-dot.completed {
            background: #64748b;
        }

        .election-header h1 {
            margin: 0 0 10px;
            font-size: 37px;
            font-weight: 800;
            letter-spacing: -.6px;
        }

        .election-description {
            max-width: 720px;
            margin: 0;
            color: rgba(255,255,255,.82);
            font-size: 15px;
            line-height: 1.7;
        }

        /* =====================================
           ELECTION INFO
        ===================================== */

        .info-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-top: 18px;
        }

        .info-card {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 17px;
            border: 1px solid #e3e8f0;
            border-radius: 16px;
            background: white;
            box-shadow:
                0 5px 18px rgba(15,23,42,.04);
        }

        .info-icon {
            width: 43px;
            height: 43px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 19px;
        }

        .info-label {
            display: block;
            margin-bottom: 2px;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 750;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .info-value {
            display: block;
            color: #334155;
            font-size: 13px;
            font-weight: 650;
        }

        /* =====================================
           RESULTS
        ===================================== */

        .results-wrapper {
            margin-top: 18px;
        }

        .results-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 11px 17px;
            border-radius: 11px;
            font-weight: 650;
        }

        /* =====================================
           POSITION SECTION
        ===================================== */

        .position-section {
            margin-top: 38px;
        }

        .position-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 17px;
        }

        .position-title-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .position-icon {
            width: 43px;
            height: 43px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 20px;
        }

        .position-title {
            margin: 0;
            font-size: 21px;
            font-weight: 780;
        }

        .position-label {
            margin-top: 2px;
            color: #94a3b8;
            font-size: 12px;
        }

        /* =====================================
           VOTE BUTTON
        ===================================== */

        .vote-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 11px 17px;
            border-radius: 11px;
            font-weight: 700;
            box-shadow:
                0 7px 18px rgba(37,99,235,.15);
            transition: .2s;
        }

        .vote-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 12px 25px rgba(37,99,235,.22);
        }

        /* =====================================
           ALREADY VOTED
        ===================================== */

        .voted-box {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 14px;
            border-radius: 11px;
            background: #ecfdf5;
            border: 1px solid #bbf7d0;
            color: #047857;
            font-size: 13px;
            font-weight: 700;
        }

        /* =====================================
           CANDIDATE CARD
        ===================================== */

        .candidate-card {
            height: 100%;
            overflow: hidden;
            border: 1px solid #e3e8f0;
            border-radius: 19px;
            background: white;
            box-shadow:
                0 6px 22px rgba(15,23,42,.045);
            transition: .25s ease;
        }

        .candidate-card:hover {
            transform: translateY(-6px);
            border-color: #d5dcff;
            box-shadow:
                0 18px 40px rgba(15,23,42,.10);
        }

        .candidate-image-wrapper {
            position: relative;
            height: 225px;
            overflow: hidden;
            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #dbeafe
                );
        }

        .candidate-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: .3s;
        }

        .candidate-card:hover .candidate-image {
            transform: scale(1.03);
        }

        .candidate-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4f46e5;
            font-size: 65px;
        }

        .candidate-body {
            padding: 21px;
        }

        .candidate-name {
            margin-bottom: 5px;
            color: #172033;
            font-size: 19px;
            font-weight: 750;
        }

        .candidate-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 13px;
        }

        .meta-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 8px;
            border-radius: 8px;
            background: #f1f5f9;
            color: #64748b;
            font-size: 11px;
            font-weight: 650;
        }

        .slogan {
            min-height: 43px;
            margin-bottom: 16px;
            color: #64748b;
            font-size: 13px;
            font-style: italic;
            line-height: 1.6;
        }

        .manifesto-btn {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-weight: 650;
        }

        /* =====================================
           EMPTY
        ===================================== */

        .empty-state {
            padding: 34px 20px;
            text-align: center;
            border: 1px dashed #cbd5e1;
            border-radius: 17px;
            background: white;
        }

        .empty-icon {
            width: 50px;
            height: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border-radius: 15px;
            background: #f1f5f9;
            color: #64748b;
            font-size: 21px;
        }

        .empty-state h6 {
            margin-bottom: 5px;
            font-weight: 700;
        }

        .empty-state p {
            margin: 0;
            color: #94a3b8;
            font-size: 13px;
        }

        /* =====================================
           MANIFESTO MODAL
        ===================================== */

        .modal-content {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                0 25px 70px rgba(15,23,42,.22);
        }

        .modal-header {
            padding: 20px 22px;
            border: none;
            color: white;
            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #2563eb
                );
        }

        .modal-title {
            font-weight: 750;
        }

        .modal-body {
            padding: 24px;
            color: #475569;
            line-height: 1.8;
            white-space: pre-line;
        }

        /* =====================================
           FOOTER
        ===================================== */

        .footer {
            margin-top: 48px;
            padding: 23px 0 8px;
            border-top: 1px solid #e5eaf2;
            color: #94a3b8;
            text-align: center;
            font-size: 13px;
        }

        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 768px) {

            .brand {
                font-size: 16px;
            }

            .brand-icon {
                width: 39px;
                height: 39px;
                font-size: 19px;
            }

            .nav-btn .nav-text {
                display: none;
            }

            .election-header {
                margin-top: 15px;
                padding: 28px;
                border-radius: 21px;
            }

            .election-header h1 {
                font-size: 29px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .position-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .vote-btn,
            .voted-box {
                width: 100%;
                justify-content: center;
            }

            .candidate-image-wrapper {
                height: 235px;
            }
        }

        @media (max-width: 576px) {

            .main-container {
                padding-left: 14px;
                padding-right: 14px;
            }

            .election-header {
                padding: 23px;
            }

            .election-header h1 {
                font-size: 26px;
            }

            .candidate-body {
                padding: 19px;
            }
        }

    </style>

</head>


<body>


<!-- =====================================
     NAVBAR
===================================== -->

<nav class="navbar topbar">

    <div class="container">

        <div class="d-flex justify-content-between align-items-center w-100">

            <a
                href="/student/dashboard"
                class="brand">

                <span class="brand-icon">
                    <i class="bi bi-check2-square"></i>
                </span>

                Student Council Voting

            </a>


            <div class="nav-actions">

                <a
                    href="/student/elections"
                    class="btn nav-btn btn-sm">

                    <i class="bi bi-arrow-left"></i>

                    <span class="nav-text ms-1">
                        Elections
                    </span>

                </a>


                <button
                    onclick="logout()"
                    class="btn nav-btn btn-sm">

                    <i class="bi bi-box-arrow-right"></i>

                    <span class="nav-text ms-1">
                        Logout
                    </span>

                </button>

            </div>

        </div>

    </div>

</nav>


<!-- =====================================
     MAIN
===================================== -->

<main class="container main-container">


    <!-- BACK -->

    <div class="back-row">

        <a
            href="/student/elections"
            class="back-btn">

            <i class="bi bi-arrow-left"></i>

            Back to Elections

        </a>

    </div>


    <!-- ELECTION HEADER -->

    <div id="electionHeader">

        <div class="election-header">

            <div class="header-content">

                <div class="election-icon">
                    <i class="bi bi-ballot2"></i>
                </div>

                <span class="status-badge">

                    <span class="status-dot"></span>

                    Loading...

                </span>

                <h1>
                    Loading Election...
                </h1>

                <p class="election-description">
                    Please wait while election details are loading.
                </p>

            </div>

        </div>

    </div>


    <!-- ELECTION INFORMATION -->

    <div id="electionInfo"></div>


    <!-- RESULTS -->

    <div
        id="resultsLink"
        class="results-wrapper">
    </div>


    <!-- POSITIONS -->

    <div id="positionsList"></div>


    <!-- FOOTER -->

    <footer class="footer">

        <i class="bi bi-shield-check me-1"></i>

        College Voting System · Student Portal

    </footer>

</main>


<!-- =====================================
     MANIFESTO MODAL
===================================== -->

<div
    class="modal fade"
    id="manifestoModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="manifestoTitle">

                    Candidate Manifesto

                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>

            <div
                class="modal-body"
                id="manifestoBody">

            </div>

        </div>

    </div>

</div>


<!-- =====================================
     BOOTSTRAP
===================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- =====================================
     AUTH
===================================== -->

<script src="/js/auth.js"></script>


<script>

    /* =====================================
       STUDENT AUTHENTICATION
    ===================================== */

    requireAuth('ROLE_STUDENT');


    /* =====================================
       ELECTION ID
    ===================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const electionId =
        params.get('id');


    if (!electionId) {

        window.location.href =
            '/student/elections';

    }


    /* =====================================
       VOTING STATUS
    ===================================== */

    let votingStatusMap = {};


    async function loadVotingStatus() {

        try {

            const res =
                await authFetch(
                    `/api/votes/status/${electionId}`
                );

            if (!res) {
                return;
            }

            if (!res.ok) {
                return;
            }

            const statuses =
                await res.json();

            if (!Array.isArray(statuses)) {
                return;
            }

            statuses.forEach(
                status => {

                    votingStatusMap[
                        status.positionId
                    ] = status.hasVoted;

                }
            );

        } catch (error) {

            console.error(
                'Voting status error:',
                error
            );

        }

    }


    /* =====================================
       HTML ESCAPE
    ===================================== */

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return '';
        }

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

    }


    /* =====================================
       DATE FORMAT
    ===================================== */

    function formatDate(value) {

        if (!value) {
            return 'Not available';
        }

        const date =
            new Date(value);

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {
            return 'Not available';
        }

        return date.toLocaleString(
            undefined,
            {
                dateStyle: 'medium',
                timeStyle: 'short'
            }
        );

    }


    /* =====================================
       STATUS CLASS
    ===================================== */

    function getStatusDot(status) {

        if (status === 'COMPLETED') {
            return 'completed';
        }

        if (status === 'UPCOMING') {
            return 'upcoming';
        }

        return '';

    }


    /* =====================================
       LOAD ELECTION
    ===================================== */

    async function loadElection() {

        try {

            await loadVotingStatus();


            const res =
                await authFetch(
                    `/api/student/elections/${electionId}`
                );


            if (!res) {
                return;
            }


            if (!res.ok) {

                throw new Error(
                    `HTTP ${res.status}`
                );

            }


            const election =
                await res.json();


            /* =================================
               HEADER
            ================================= */

            document
                .getElementById(
                    'electionHeader'
                )
                .innerHTML = `

                    <div class="election-header">

                        <div class="header-content">

                            <div class="election-icon">

                                <i class="bi bi-ballot2"></i>

                            </div>


                            <span class="status-badge">

                                <span class="status-dot
                                    ${getStatusDot(
                                        election.status
                                    )}">
                                </span>

                                ${escapeHtml(
                                    election.status
                                )}

                            </span>


                            <h1>
                                ${escapeHtml(
                                    election.name
                                )}
                            </h1>


                            <p class="election-description">

                                ${escapeHtml(
                                    election.description ||
                                    'College Student Council Election'
                                )}

                            </p>

                        </div>

                    </div>

                `;


            /* =================================
               INFORMATION CARDS
            ================================= */

            document
                .getElementById(
                    'electionInfo'
                )
                .innerHTML = `

                    <div class="info-grid">

                        <div class="info-card">

                            <div class="info-icon">
                                <i class="bi bi-calendar-plus"></i>
                            </div>

                            <div>

                                <span class="info-label">
                                    Start Date
                                </span>

                                <span class="info-value">
                                    ${formatDate(
                                        election.startDateTime
                                    )}
                                </span>

                            </div>

                        </div>


                        <div class="info-card">

                            <div class="info-icon">
                                <i class="bi bi-calendar-x"></i>
                            </div>

                            <div>

                                <span class="info-label">
                                    End Date
                                </span>

                                <span class="info-value">
                                    ${formatDate(
                                        election.endDateTime
                                    )}
                                </span>

                            </div>

                        </div>


                        <div class="info-card">

                            <div class="info-icon">
                                <i class="bi bi-mortarboard"></i>
                            </div>

                            <div>

                                <span class="info-label">
                                    Academic Year
                                </span>

                                <span class="info-value">

                                    ${escapeHtml(
                                        election.academicYear ||
                                        'Not specified'
                                    )}

                                </span>

                            </div>

                        </div>


                        <div class="info-card">

                            <div class="info-icon">
                                <i class="bi bi-list-check"></i>
                            </div>

                            <div>

                                <span class="info-label">
                                    Positions
                                </span>

                                <span class="info-value">

                                    ${
                                        election.positions
                                            ? election.positions.length
                                            : 0
                                    }

                                    Position(s)

                                </span>

                            </div>

                        </div>

                    </div>

                `;


            /* =================================
               RESULTS LINK
            ================================= */

            const resultsDiv =
                document.getElementById(
                    'resultsLink'
                );


            if (
                election.status === 'COMPLETED' ||
                election.showLiveResults
            ) {

                resultsDiv.innerHTML = `

                    <a
                        href="/student/results?id=${encodeURIComponent(
                            electionId
                        )}"
                        class="btn btn-outline-primary results-btn">

                        <i class="bi bi-bar-chart-fill"></i>

                        View Election Results

                        <i class="bi bi-arrow-right"></i>

                    </a>

                `;

            } else {

                resultsDiv.innerHTML = '';

            }


            /* =================================
               POSITIONS
            ================================= */

            const positions =
                election.positions || [];


            const container =
                document.getElementById(
                    'positionsList'
                );


            if (positions.length === 0) {

                container.innerHTML = `

                    <div class="empty-state mt-4">

                        <div class="empty-icon">

                            <i class="bi bi-list-check"></i>

                        </div>

                        <h6>
                            No Positions Available
                        </h6>

                        <p>
                            No positions have been set up
                            for this election yet.
                        </p>

                    </div>

                `;

                return;

            }


            container.innerHTML = '';


            /* =================================
               EACH POSITION
            ================================= */

            for (const pos of positions) {

                const hasVoted =
                    votingStatusMap[pos.id] === true;


                const section =
                    document.createElement(
                        'section'
                    );


                section.className =
                    'position-section';


                let actionButton = '';


                if (
                    election.status === 'ACTIVE'
                ) {

                    if (hasVoted) {

                        actionButton = `

                            <div class="voted-box">

                                <i class="bi bi-check-circle-fill"></i>

                                You already voted

                            </div>

                        `;

                    } else {

                        actionButton = `

                            <a
                                href="/student/vote?electionId=${encodeURIComponent(
                                    electionId
                                )}&positionId=${encodeURIComponent(
                                    pos.id
                                )}"
                                class="btn btn-primary vote-btn">

                                <i class="bi bi-ballot2"></i>

                                Vote Now

                                <i class="bi bi-arrow-right"></i>

                            </a>

                        `;

                    }

                }


                section.innerHTML = `

                    <div class="position-header">

                        <div class="position-title-wrapper">

                            <div class="position-icon">

                                <i class="bi bi-person-badge"></i>

                            </div>

                            <div>

                                <h2 class="position-title">

                                    ${escapeHtml(
                                        pos.title
                                    )}

                                </h2>

                                <div class="position-label">
                                    Candidates
                                </div>

                            </div>

                        </div>


                        ${actionButton}

                    </div>


                    <div
                        class="row g-4"
                        id="pos-${pos.id}">

                    </div>

                `;


                container.appendChild(
                    section
                );


                await loadCandidates(
                    pos.id
                );

            }

        } catch (error) {

            console.error(
                'Election loading error:',
                error
            );


            document
                .getElementById(
                    'electionHeader'
                )
                .innerHTML = `

                    <div class="empty-state mt-4">

                        <div class="empty-icon">

                            <i class="bi bi-exclamation-triangle"></i>

                        </div>

                        <h6>
                            Unable to Load Election
                        </h6>

                        <p>
                            Please refresh the page
                            and try again.
                        </p>

                    </div>

                `;

        }

    }


    /* =====================================
       LOAD CANDIDATES
    ===================================== */

    async function loadCandidates(
        positionId
    ) {

        try {

            const res =
                await authFetch(
                    `/api/student/candidates/position/${positionId}`
                );


            if (!res) {
                return;
            }


            if (!res.ok) {

                throw new Error(
                    `HTTP ${res.status}`
                );

            }


            const candidates =
                await res.json();


            const target =
                document.getElementById(
                    'pos-' + positionId
                );


            if (!target) {
                return;
            }


            if (
                !Array.isArray(candidates) ||
                candidates.length === 0
            ) {

                target.innerHTML = `

                    <div class="col-12">

                        <div class="empty-state">

                            <div class="empty-icon">

                                <i class="bi bi-person-x"></i>

                            </div>

                            <h6>
                                No Approved Candidates
                            </h6>

                            <p>
                                There are no approved candidates
                                for this position yet.
                            </p>

                        </div>

                    </div>

                `;

                return;

            }


            target.innerHTML = '';


            candidates.forEach(
                candidate => {

                    const col =
                        document.createElement(
                            'div'
                        );


                    col.className =
                        'col-sm-6 col-lg-4';


                    const department =
                        candidate.department ||
                        'Department not specified';


                    const year =
                        candidate.year ||
                        'Year not specified';


                    const slogan =
                        candidate.slogan ||
                        'No slogan provided.';


                    col.innerHTML = `

                        <div class="candidate-card">


                            <div class="candidate-image-wrapper">

                                ${
                                    candidate.photoUrl
                                    ?

                                    `
                                    <img
                                        src="${escapeHtml(
                                            candidate.photoUrl
                                        )}"
                                        class="candidate-image"
                                        alt="Candidate photo"
                                        loading="lazy">
                                    `

                                    :

                                    `
                                    <div
                                        class="candidate-placeholder">

                                        <i class="bi bi-person"></i>

                                    </div>
                                    `
                                }

                            </div>


                            <div class="candidate-body">


                                <div class="candidate-name">

                                    ${escapeHtml(
                                        candidate.fullName
                                    )}

                                </div>


                                <div class="candidate-meta">

                                    <span class="meta-chip">

                                        <i class="bi bi-building"></i>

                                        ${escapeHtml(
                                            department
                                        )}

                                    </span>


                                    <span class="meta-chip">

                                        <i class="bi bi-mortarboard"></i>

                                        ${escapeHtml(
                                            year
                                        )}

                                    </span>

                                </div>


                                <p class="slogan">

                                    "${escapeHtml(
                                        slogan
                                    )}"

                                </p>


                                <button
                                    type="button"
                                    class="btn btn-outline-primary manifesto-btn">

                                    <i class="bi bi-file-text me-1"></i>

                                    Read Manifesto

                                </button>


                            </div>

                        </div>

                    `;


                    const manifestoButton =
                        col.querySelector(
                            '.manifesto-btn'
                        );


                    manifestoButton.addEventListener(
                        'click',
                        () => {

                            showManifesto(
                                candidate.fullName,
                                candidate.manifesto
                            );

                        }
                    );


                    target.appendChild(
                        col
                    );

                }
            );

        } catch (error) {

            console.error(
                'Candidate loading error:',
                error
            );

        }

    }


    /* =====================================
       MANIFESTO
    ===================================== */

    function showManifesto(
        candidateName,
        manifesto
    ) {

        document.getElementById(
            'manifestoTitle'
        ).textContent =
            `${candidateName || 'Candidate'} - Manifesto`;


        document.getElementById(
            'manifestoBody'
        ).textContent =
            manifesto ||
            'No manifesto provided.';


        const modalElement =
            document.getElementById(
                'manifestoModal'
            );


        const modal =
            bootstrap.Modal.getOrCreateInstance(
                modalElement
            );


        modal.show();

    }


    /* =====================================
       START
    ===================================== */

    loadElection();

</script>

</body>
</html>
