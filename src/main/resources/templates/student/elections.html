<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elections | College Voting</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #172033;
        }

        .topbar {
            background: linear-gradient(135deg, #4f46e5, #2563eb);
            min-height: 72px;
            box-shadow: 0 5px 20px rgba(37,99,235,.18);
        }

        .brand {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(255,255,255,.18);
            margin-right: 10px;
        }

        .nav-btn {
            color: white;
            border: 1px solid rgba(255,255,255,.55);
            border-radius: 10px;
        }

        .nav-btn:hover {
            background: white;
            color: #2563eb;
        }

        .page-header {
            margin-top: 40px;
            margin-bottom: 35px;
        }

        .page-header h1 {
            font-size: 34px;
            font-weight: 750;
        }

        .page-header p {
            color: #64748b;
        }

        .section-heading {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 17px;
            font-weight: 700;
        }

        .heading-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: #eef2ff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .election-card {
            border: 1px solid #e3e8f0;
            border-radius: 18px;
            background: white;
            overflow: hidden;
            height: 100%;
            transition: .25s;
            box-shadow: 0 5px 20px rgba(15,23,42,.04);
        }

        .election-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 38px rgba(15,23,42,.09);
        }

        .card-top {
            height: 7px;
            background: linear-gradient(90deg, #4f46e5, #2563eb);
        }

        .election-body {
            padding: 25px;
        }

        .election-title {
            font-weight: 700;
            font-size: 20px;
            margin-bottom: 9px;
        }

        .description {
            color: #64748b;
            font-size: 14px;
            min-height: 43px;
        }

        .date-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 11px 13px;
            margin-bottom: 9px;
            font-size: 13px;
        }

        .date-box i {
            color: #4f46e5;
            margin-right: 5px;
        }

        .view-btn {
            border-radius: 10px;
            font-weight: 600;
            padding: 10px 16px;
        }

        .empty {
            background: white;
            border: 1px dashed #cbd5e1;
            border-radius: 15px;
            padding: 22px;
            color: #64748b;
        }
    </style>
</head>

<body>

<nav class="navbar topbar">
    <div class="container d-flex justify-content-between">

        <a class="brand" href="/student/dashboard">
            <span class="brand-icon">
                <i class="bi bi-check2-square"></i>
            </span>
            Student Council Voting
        </a>

        <div class="d-flex gap-2">
            <a href="/student/dashboard" class="btn nav-btn btn-sm">
                <i class="bi bi-house me-1"></i>
                Dashboard
            </a>

            <button onclick="logout()" class="btn nav-btn btn-sm">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </button>
        </div>

    </div>
</nav>

<div class="container">

    <div class="page-header">
        <h1>College Elections</h1>
        <p>
            Explore elections and cast your vote for your preferred candidates.
        </p>
    </div>

    <section class="mb-5">

        <h4 class="section-heading">
            <span class="heading-icon">
                <i class="bi bi-broadcast"></i>
            </span>
            Active Elections
        </h4>

        <div id="activeList" class="row g-4"></div>

    </section>

    <section class="mb-5">

        <h4 class="section-heading">
            <span class="heading-icon">
                <i class="bi bi-calendar-event"></i>
            </span>
            Upcoming Elections
        </h4>

        <div id="upcomingList" class="row g-4"></div>

    </section>

    <section class="mb-5">

        <h4 class="section-heading">
            <span class="heading-icon">
                <i class="bi bi-check-circle"></i>
            </span>
            Completed Elections
        </h4>

        <div id="completedList" class="row g-4"></div>

    </section>

</div>

<script src="/js/auth.js"></script>

<script>
requireAuth('ROLE_STUDENT');

function renderCard(e) {

    const canVote = e.status === 'ACTIVE';

    return `
        <div class="col-lg-6">

            <div class="election-card">

                <div class="card-top"></div>

                <div class="election-body">

                    <div class="d-flex justify-content-between align-items-start mb-2">

                        <h5 class="election-title">
                            ${e.name}
                        </h5>

                        <span class="badge ${
                            e.status === 'ACTIVE'
                            ? 'bg-success'
                            : e.status === 'COMPLETED'
                            ? 'bg-secondary'
                            : 'bg-warning text-dark'
                        }">
                            ${e.status}
                        </span>

                    </div>

                    <p class="description">
                        ${e.description || 'No description available.'}
                    </p>

                    <div class="date-box">
                        <i class="bi bi-calendar-plus"></i>
                        <strong>Starts:</strong>
                        ${new Date(e.startDateTime).toLocaleString()}
                    </div>

                    <div class="date-box mb-4">
                        <i class="bi bi-calendar-x"></i>
                        <strong>Ends:</strong>
                        ${new Date(e.endDateTime).toLocaleString()}
                    </div>

                    <a href="/student/election-details?id=${e.id}"
                       class="btn ${
                            canVote
                            ? 'btn-primary'
                            : 'btn-outline-secondary'
                       } view-btn">

                        <i class="bi ${
                            canVote
                            ? 'bi-ballot2'
                            : 'bi-eye'
                        } me-1"></i>

                        ${
                            canVote
                            ? 'Vote Now / View Details'
                            : e.status === 'COMPLETED'
                            ? 'View Results'
                            : 'View Details'
                        }

                    </a>

                </div>

            </div>

        </div>
    `;
}

async function loadSection(status, elementId) {

    const res = await authFetch(
        `/api/student/elections/${status}`
    );

    if (!res) return;

    const elections = await res.json();

    const container = document.getElementById(elementId);

    container.innerHTML = elections.length
        ? elections.map(renderCard).join('')
        : `
            <div class="col-12">
                <div class="empty">
                    <i class="bi bi-info-circle me-2"></i>
                    No elections available right now.
                </div>
            </div>
        `;
}

loadSection('active', 'activeList');
loadSection('upcoming', 'upcomingList');
loadSection('completed', 'completedList');
</script>

</body>
</html>
