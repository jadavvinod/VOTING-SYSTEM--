<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications | College Voting</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .topbar {
            background: linear-gradient(135deg,#4f46e5,#2563eb);
            min-height: 72px;
            box-shadow: 0 5px 20px rgba(37,99,235,.18);
        }

        .brand {
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 20px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,.18);
            border-radius: 12px;
            margin-right: 10px;
        }

        .nav-btn {
            color: white;
            border: 1px solid rgba(255,255,255,.55);
            border-radius: 10px;
        }

        .nav-btn:hover {
            background: white;
            color: #2563eb;
        }

        .page {
            max-width: 820px;
            margin: 45px auto;
        }

        .page-title {
            font-size: 34px;
            font-weight: 750;
        }

        .page-subtitle {
            color: #64748b;
        }

        .notification-card {
            background: white;
            border: 1px solid #e3e8f0;
            border-radius: 17px;
            padding: 20px;
            margin-bottom: 15px;
            transition: .2s;
            box-shadow: 0 4px 18px rgba(15,23,42,.035);
        }

        .notification-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(15,23,42,.07);
        }

        .unread {
            border-left: 5px solid #4f46e5;
        }

        .notification-icon {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 20px;
        }

        .notification-title {
            font-weight: 700;
        }

        .notification-message {
            color: #475569;
            font-size: 14px;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 20px;
            border: 1px dashed #cbd5e1;
            color: #64748b;
        }

        .empty i {
            font-size: 45px;
            color: #94a3b8;
            display: block;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<nav class="navbar topbar">
    <div class="container d-flex justify-content-between">

        <a href="/student/dashboard" class="brand">
            <span class="brand-icon">
                <i class="bi bi-check2-square"></i>
            </span>
            Student Council Voting
        </a>

        <div class="d-flex gap-2">

            <a href="/student/dashboard"
               class="btn nav-btn btn-sm">
                <i class="bi bi-house"></i>
            </a>

            <button onclick="logout()"
                    class="btn nav-btn btn-sm">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </button>

        </div>

    </div>
</nav>

<div class="container">

    <div class="page">

        <h1 class="page-title">
            <i class="bi bi-bell-fill text-primary me-2"></i>
            Notifications
        </h1>

        <p class="page-subtitle mb-4">
            Stay updated with important election announcements.
        </p>

        <div id="notificationsList"></div>

    </div>

</div>

<script src="/js/auth.js"></script>

<script>
requireAuth('ROLE_STUDENT');

function typeBadge(type) {

    const map = {
        ELECTION_OPEN: 'bg-success',
        ELECTION_CLOSING: 'bg-warning text-dark',
        RESULTS_PUBLISHED: 'bg-primary',
        GENERAL: 'bg-secondary'
    };

    return map[type] || 'bg-secondary';
}

function notificationIcon(type) {

    const map = {
        ELECTION_OPEN: 'bi-megaphone',
        ELECTION_CLOSING: 'bi-clock',
        RESULTS_PUBLISHED: 'bi-bar-chart-fill',
        GENERAL: 'bi-info-circle'
    };

    return map[type] || 'bi-bell';
}

async function loadNotifications() {

    const res = await authFetch(
        '/api/student/notifications'
    );

    if (!res) return;

    const notifications = await res.json();

    const container =
        document.getElementById('notificationsList');

    if (notifications.length === 0) {

        container.innerHTML = `
            <div class="empty">

                <i class="bi bi-bell-slash"></i>

                <h5>No notifications yet</h5>

                <p class="mb-0">
                    You're all caught up!
                </p>

            </div>
        `;

        return;
    }

    container.innerHTML = notifications.map(n => `

        <div class="notification-card
             ${n.isRead ? '' : 'unread'}"
             data-id="${n.id}">

            <div class="d-flex gap-3">

                <div class="notification-icon">
                    <i class="bi ${notificationIcon(n.type)}"></i>
                </div>

                <div class="flex-grow-1">

                    <div class="d-flex justify-content-between
                                align-items-start gap-2">

                        <div class="notification-title">

                            ${n.title}

                            ${
                                n.isRead
                                ? ''
                                :
                                `<span class="badge bg-primary ms-2">
                                    New
                                </span>`
                            }

                        </div>

                        <span class="badge ${typeBadge(n.type)}">
                            ${n.type.replaceAll('_',' ')}
                        </span>

                    </div>

                    <p class="notification-message mt-2 mb-2">
                        ${n.message}
                    </p>

                    <div class="small text-muted mb-2">
                        <i class="bi bi-clock me-1"></i>
                        ${new Date(n.createdAt).toLocaleString()}
                    </div>

                    ${
                        n.isRead
                        ? ''
                        :
                        `
                        <button class="btn btn-sm
                                       btn-outline-secondary
                                       mark-read-btn">

                            <i class="bi bi-check2 me-1"></i>
                            Mark as read

                        </button>
                        `
                    }

                </div>

            </div>

        </div>

    `).join('');

    container.querySelectorAll('.mark-read-btn')
    .forEach(btn => {

        btn.addEventListener('click', async function() {

            const card =
                this.closest('[data-id]');

            const id =
                card.getAttribute('data-id');

            await authFetch(
                `/api/student/notifications/${id}/read`,
                {
                    method: 'PATCH'
                }
            );

            loadNotifications();

        });

    });
}

loadNotifications();
</script>

</body>
</html>
