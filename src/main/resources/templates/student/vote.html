<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cast Your Vote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/student/dashboard">Student Council Voting</a>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container py-4" style="max-width: 700px;">
    <div id="alertBox" class="alert d-none"></div>

    <!-- Step 1: Ballot -->
    <div id="ballotStep">
        <h3 id="positionTitle">Loading...</h3>
        <p class="text-muted">Select one candidate, then review your choice before submitting.</p>
        <form id="ballotForm">
            <div id="candidateOptions" class="list-group mb-4"></div>
            <button type="submit" class="btn btn-primary w-100" id="reviewBtn" disabled>Review My Vote</button>
        </form>
    </div>

    <!-- Step 2: Review / Confirm -->
    <div id="reviewStep" class="d-none">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">Review Your Vote</h4>
                <p class="mb-1"><strong>Position:</strong></p>
                <p id="reviewPosition" class="mb-3"></p>
                <p class="mb-1"><strong>Selected Candidate:</strong></p>
                <p id="reviewCandidate" class="mb-4"></p>
                <p class="fw-bold">Are you sure you want to submit your vote?</p>
                <p class="text-muted small">This cannot be undone. You can only vote once per position.</p>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary flex-fill" id="cancelBtn">Cancel</button>
                    <button class="btn btn-success flex-fill" id="confirmBtn">Confirm Vote</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
<script>
requireAuth('ROLE_STUDENT');

const params = new URLSearchParams(window.location.search);
const electionId = params.get('electionId');
const positionId = params.get('positionId');

if (!electionId || !positionId) {
    window.location.href = '/student/dashboard';
}

let selectedCandidate = null;

function showAlert(message, type) {
    const box = document.getElementById('alertBox');
    box.textContent = message;
    box.className = 'alert alert-' + type;
}

async function loadBallot() {
    // Guard: if the student already voted for this position, don't let them re-open the ballot.
    const statusRes = await authFetch(`/api/votes/status/${electionId}`);
    if (statusRes) {
        const statuses = await statusRes.json();
        const thisPosition = statuses.find(s => String(s.positionId) === String(positionId));
        if (thisPosition && thisPosition.hasVoted) {
            showAlert('You have already voted for this position.', 'warning');
            document.getElementById('ballotStep').classList.add('d-none');
            return;
        }
        if (thisPosition) {
            document.getElementById('positionTitle').textContent = thisPosition.positionTitle;
        }
    }

    const res = await authFetch(`/api/student/candidates/position/${positionId}`);
    if (!res) return;
    const candidates = await res.json();

    const container = document.getElementById('candidateOptions');
    container.innerHTML = '';

    if (candidates.length === 0) {
        container.innerHTML = '<p class="text-muted">No approved candidates for this position.</p>';
        return;
    }

    candidates.forEach(c => {
        const item = document.createElement('label');
        item.className = 'list-group-item d-flex align-items-center gap-3';
        item.innerHTML = `
            <input type="radio" name="candidate" class="form-check-input mt-0" value="${c.id}">
            ${c.photoUrl ? `<img src="${c.photoUrl}" style="width:48px;height:48px;object-fit:cover;border-radius:50%;">` : ''}
            <span>
                <strong>${c.fullName}</strong><br>
                <span class="text-muted small">${c.slogan || ''}</span>
            </span>
        `;
        item.querySelector('input').addEventListener('change', () => {
            selectedCandidate = c;
            document.getElementById('reviewBtn').disabled = false;
        });
        container.appendChild(item);
    });
}

document.getElementById('ballotForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!selectedCandidate) return;

    document.getElementById('reviewPosition').textContent = document.getElementById('positionTitle').textContent;
    document.getElementById('reviewCandidate').textContent = selectedCandidate.fullName;

    document.getElementById('ballotStep').classList.add('d-none');
    document.getElementById('reviewStep').classList.remove('d-none');
});

document.getElementById('cancelBtn').addEventListener('click', function () {
    document.getElementById('reviewStep').classList.add('d-none');
    document.getElementById('ballotStep').classList.remove('d-none');
});

document.getElementById('confirmBtn').addEventListener('click', async function () {
    const btn = this;
    // Prevent accidental double-click / double submission.
    btn.disabled = true;
    document.getElementById('cancelBtn').disabled = true;
    btn.textContent = 'Submitting...';

    const res = await authFetch('/api/votes', {
        method: 'POST',
        body: JSON.stringify({
            positionId: Number(positionId),
            candidateId: selectedCandidate.id
        })
    });

    if (!res) return;
    const data = await res.json();

    if (!res.ok) {
        showAlert(data.message || 'Failed to submit vote.', 'danger');
        btn.disabled = false;
        document.getElementById('cancelBtn').disabled = false;
        btn.textContent = 'Confirm Vote';
        return;
    }

    window.location.href = `/student/vote-success?electionId=${electionId}`;
});

loadBallot();
</script>
</body>
</html>
