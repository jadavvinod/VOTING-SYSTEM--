<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | College Voting</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #172033;
        }

        .topbar {
            background: linear-gradient(135deg, #4f46e5, #2563eb);
            min-height: 72px;
            box-shadow: 0 5px 20px rgba(37, 99, 235, .18);
        }

        .brand {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
        }

        .brand-icon {
            display: inline-flex;
            width: 42px;
            height: 42px;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,.18);
            border-radius: 12px;
            margin-right: 10px;
        }

        .back-btn {
            color: white;
            border: 1px solid rgba(255,255,255,.55);
            border-radius: 10px;
        }

        .back-btn:hover {
            background: white;
            color: #2563eb;
        }

        .profile-wrapper {
            max-width: 700px;
            margin: 45px auto;
        }

        .profile-card {
            background: white;
            border: 1px solid #e5eaf2;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(15,23,42,.08);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 0 auto 18px;
            background: #eef2ff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            overflow: hidden;
            border: 4px solid #e0e7ff;
        }

        .profile-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-header h2 {
            font-weight: 750;
            margin-bottom: 5px;
        }

        .profile-header p {
            color: #64748b;
            margin: 0;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .form-control {
            min-height: 48px;
            border-radius: 11px;
            border: 1px solid #dbe1ea;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99,102,241,.12);
        }

        .readonly {
            background: #f8fafc;
        }

        .save-btn {
            min-height: 50px;
            border-radius: 12px;
            font-weight: 650;
        }

        .password-btn {
            min-height: 48px;
            border-radius: 12px;
        }

        .file-help {
            color: #64748b;
            font-size: 13px;
        }

        .section-divider {
            border: 0;
            border-top: 1px solid #e5eaf2;
            margin: 30px 0;
        }

        @media(max-width:576px) {
            .profile-card {
                padding: 25px;
            }

            .profile-wrapper {
                margin: 25px auto;
            }
        }
    </style>
</head>

<body>

<nav class="navbar topbar">
    <div class="container d-flex justify-content-between align-items-center">

        <a class="brand" href="/student/dashboard">
            <span class="brand-icon">
                <i class="bi bi-check2-square"></i>
            </span>
            Student Council Voting
        </a>

        <a href="/student/dashboard" class="btn back-btn">
            <i class="bi bi-arrow-left me-1"></i>
            Dashboard
        </a>

    </div>
</nav>

<div class="container">

    <div class="profile-wrapper">

        <div class="profile-card">

            <div class="profile-header">

                <div class="profile-circle" id="profileCircle">
                    <i class="bi bi-person"></i>
                </div>

                <h2 id="profileName">Student</h2>

                <p id="profileEmail">Loading...</p>

            </div>

            <div id="alertBox" class="alert d-none"></div>

            <form id="profileForm">

                <div class="mb-3">

                    <label class="form-label">
                        Profile Picture
                    </label>

                    <input
                        type="file"
                        class="form-control"
                        id="profileImage"
                        accept="image/png,image/jpeg,image/jpg,image/webp">

                    <div class="file-help mt-2">
                        Select an image from your computer.
                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Student ID
                    </label>

                    <input
                        type="text"
                        class="form-control readonly"
                        id="studentId"
                        readonly>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="fullName"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Registered Email
                    </label>

                    <input
                        type="email"
                        class="form-control readonly"
                        id="email"
                        readonly>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Department
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="department">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Course
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="course">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Year
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="year">

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="phoneNumber">

                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100 save-btn"
                    id="saveBtn">

                    <i class="bi bi-check-circle me-1"></i>
                    Save Profile

                </button>

            </form>

            <hr class="section-divider">

            <a
                href="/student/change-password"
                class="btn btn-outline-secondary w-100 password-btn">

                <i class="bi bi-shield-lock me-1"></i>
                Change Password

            </a>

        </div>

    </div>

</div>

<script src="/js/auth.js"></script>

<script>

requireAuth('ROLE_STUDENT');

async function loadProfile() {

    const res = await authFetch('/api/student/profile');

    if (!res) return;

    if (!res.ok) {

        const data = await res.json().catch(() => ({}));

        showAlert(
            data.message || 'Unable to load profile.',
            'danger'
        );

        return;
    }

    const data = await res.json();

    document.getElementById('studentId').value =
        data.studentId || '';

    document.getElementById('fullName').value =
        data.fullName || '';

    document.getElementById('email').value =
        data.email || '';

    document.getElementById('department').value =
        data.department || '';

    document.getElementById('course').value =
        data.course || '';

    document.getElementById('year').value =
        data.year || '';

    document.getElementById('phoneNumber').value =
        data.phoneNumber || '';

    document.getElementById('profileName').textContent =
        data.fullName || 'Student';

    document.getElementById('profileEmail').textContent =
        data.email || '';

}

function showAlert(message, type) {

    const alertBox = document.getElementById('alertBox');

    alertBox.className =
        'alert alert-' + type;

    alertBox.textContent = message;

    alertBox.classList.remove('d-none');

}

document.getElementById('profileImage')
.addEventListener('change', function() {

    const file = this.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        document.getElementById('profileCircle').innerHTML =
            '<img src="' + e.target.result + '" alt="Profile Picture">';

    };

    reader.readAsDataURL(file);

});

document.getElementById('profileForm')
.addEventListener('submit', async function(e) {

    e.preventDefault();

    const btn = document.getElementById('saveBtn');

    btn.disabled = true;

    btn.innerHTML =
        '<span class="spinner-border spinner-border-sm me-2"></span>' +
        'Saving...';

    /*
     * Profile image upload/save will be connected
     * after the backend endpoint is added.
     */

    showAlert(
        'Profile page is working. Image/database save endpoint still needs to be connected.',
        'success'
    );

    btn.disabled = false;

    btn.innerHTML =
        '<i class="bi bi-check-circle me-1"></i> Save Profile';

});

loadProfile();

</script>

</body>
</html>
