<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vote Recorded | College Voting</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg,#eef2ff,#f8fafc,#eff6ff);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .success-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .success-card {
            width: 100%;
            max-width: 570px;
            background: white;
            border-radius: 28px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 25px 70px rgba(15,23,42,.10);
            border: 1px solid #e3e8f0;
        }

        .success-icon {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px;
            font-size: 55px;
            animation: pop .5s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-card h1 {
            font-weight: 750;
            margin-bottom: 12px;
        }

        .success-card p {
            color: #64748b;
            font-size: 16px;
        }

        .success-message {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 14px;
            padding: 15px;
            margin: 25px 0;
            color: #166534;
        }

        .btn-custom {
            padding: 11px 19px;
            border-radius: 11px;
            font-weight: 600;
        }

        @media(max-width:576px) {
            .success-card {
                padding: 40px 25px;
            }

            .success-card h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="success-wrapper">

    <div class="success-card">

        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>

        <h1>Vote Successfully Recorded!</h1>

        <p>
            Thank you for participating in the College Student Council Election.
        </p>

        <div class="success-message">
            <i class="bi bi-shield-check me-1"></i>
            Your vote has been securely submitted.
        </div>

        <div class="d-flex justify-content-center
                    flex-wrap gap-2">

            <a href="#"
               id="backToElectionBtn"
               class="btn btn-primary btn-custom">

                <i class="bi bi-arrow-left me-1"></i>
                Back to Election

            </a>

            <a href="/student/dashboard"
               class="btn btn-outline-secondary btn-custom">

                <i class="bi bi-house me-1"></i>
                Dashboard

            </a>

        </div>

    </div>

</div>

<script src="/js/auth.js"></script>

<script>
requireAuth('ROLE_STUDENT');

const params =
    new URLSearchParams(window.location.search);

const electionId =
    params.get('electionId');

if (electionId) {

    document.getElementById(
        'backToElectionBtn'
    ).href =
        `/student/election-details?id=${electionId}`;

} else {

    document.getElementById(
        'backToElectionBtn'
    ).href =
        '/student/elections';

}
</script>

</body>
</html>
