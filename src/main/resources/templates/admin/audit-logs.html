<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audit Logs | Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
            font-family: Inter, system-ui, sans-serif;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 250px;
            background: #111827;
            padding: 24px 16px;
            z-index: 1000;
        }

        .brand {
            color: white;
            font-size: 21px;
            font-weight: 700;
            padding: 10px 14px 25px;
            border-bottom: 1px solid rgba(255,255,255,.1);
            margin-bottom: 20px;
        }

        .brand span {
            color: #818cf8;
        }

        .nav-link-custom {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .nav-link-custom:hover,
        .nav-link-custom.active {
            background: #312e81;
            color: white;
        }

        .main {
            margin-left: 250px;
            min-height: 100vh;
        }

        .topbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
        }

        .content {
            padding: 30px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
        }

        .filter-card,
        .table-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 3px 12px rgba(0,0,0,.03);
        }

        .filter-card {
            padding: 20px;
        }

        .table-card {
            overflow: hidden;
        }

        .table thead th {
            background: #f8fafc;
            color: #64748b;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .03em;
            border-bottom: 1px solid #e5e7eb;
            padding: 15px;
        }

        .table tbody td {
            padding: 15px;
            vertical-align: middle;
        }

        .action-badge {
            background: #eef2ff;
            color: #4338ca;
            border-radius: 7px;
            padding: 5px 9px;
            font-size: 12px;
            font-weight: 600;
        }

        .entity-badge {
            background: #f1f5f9;
            color: #475569;
            border-radius: 7px;
            padding: 5px 9px;
            font-size: 12px;
        }

        .form-control,
        .form-select {
            border-radius: 9px;
        }

        @media(max-width:900px) {

            .sidebar {
                width: 70px;
            }

            .brand {
                font-size: 0;
                text-align: center;
            }

            .brand span {
                font-size: 22px;
            }

            .nav-link-custom span {
                display: none;
            }

            .nav-link-custom {
                justify-content: center;
            }

            .main {
                margin-left: 70px;
            }

        }

        @media(max-width:600px) {

            .content {
                padding: 18px;
            }

            .topbar {
                padding: 0 15px;
            }

        }

    </style>

</head>

<body>

<aside class="sidebar">

    <div class="brand">
        College <span>Voting</span>
    </div>

    <a href="/admin/dashboard" class="nav-link-custom">
        <span>📊</span>
        <span>Dashboard</span>
    </a>

    <a href="/admin/elections" class="nav-link-custom">
        <span>🗳️</span>
        <span>Elections</span>
    </a>

    <a href="/admin/students" class="nav-link-custom">
        <span>👨‍🎓</span>
        <span>Students</span>
    </a>

    <a href="/admin/candidates" class="nav-link-custom">
        <span>👥</span>
        <span>Candidates</span>
    </a>

    <a href="/admin/results" class="nav-link-custom">
        <span>📈</span>
        <span>Results</span>
    </a>

    <a href="/admin/audit-logs" class="nav-link-custom active">
        <span>📋</span>
        <span>Audit Logs</span>
    </a>

    <div style="position:absolute;bottom:20px;left:16px;right:16px;">
        <button class="btn btn-outline-light w-100" onclick="logout()">
            Logout
        </button>
    </div>

</aside>

<main class="main">

    <header class="topbar">

        <strong>Audit Logs</strong>

        <span class="text-muted small">
            Security & Activity
        </span>

    </header>

    <div class="content">

        <div class="mb-4">

            <h1 class="page-title mb-1">
                Audit Logs
            </h1>

            <div class="text-muted">
                Track important administrator activities.
            </div>

        </div>

        <div id="alertBox"></div>

        <div class="filter-card mb-4">

            <div class="row g-3 align-items-end">

                <div class="col-lg-5">

                    <label class="form-label fw-semibold">
                        Search Action
                    </label>

                    <input
                            type="text"
                            class="form-control"
                            id="filterAction"
                            placeholder="e.g. election created">

                </div>

                <div class="col-lg-4">

                    <label class="form-label fw-semibold">
                        Entity Type
                    </label>

                    <select
                            class="form-select"
                            id="filterEntityType">

                        <option value="">
                            All Entity Types
                        </option>

                        <option value="Election">
                            Election
                        </option>

                        <option value="Candidate">
                            Candidate
                        </option>

                        <option value="Student">
                            Student
                        </option>

                    </select>

                </div>

                <div class="col-lg-3">

                    <button
                            class="btn btn-primary w-100"
                            id="searchBtn">
                        🔍 Search Logs
                    </button>

                </div>

            </div>

        </div>

        <div class="table-card">

            <div class="table-responsive">

                <table class="table table-hover mb-0">

                    <thead>

                    <tr>

                        <th>Timestamp</th>

                        <th>Administrator</th>

                        <th>Action</th>

                        <th>Entity</th>

                        <th>Entity ID</th>

                    </tr>

                    </thead>

                    <tbody id="logsTableBody"></tbody>

                </table>

            </div>

        </div>

    </div>

</main>

<script src="/js/auth.js"></script>

<script>

requireAuth('ROLE_ADMIN');

function escapeHtml(value) {

    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}

async function loadLogs() {

    const params =
        new URLSearchParams({

            action:
                document.getElementById(
                    'filterAction'
                ).value,

            entityType:
                document.getElementById(
                    'filterEntityType'
                ).value

        });

    const res =
        await authFetch(
            '/api/admin/audit-logs?' +
            params.toString()
        );

    if (!res) return;

    if (!res.ok) {

        document.getElementById(
            'logsTableBody'
        ).innerHTML = `
            <tr>
                <td colspan="5"
                    class="text-center text-danger py-5">
                    Failed to load audit logs.
                </td>
            </tr>
        `;

        return;
    }

    const logs =
        await res.json();

    document.getElementById(
        'logsTableBody'
    ).innerHTML =

        logs.map(l => `

            <tr>

                <td class="text-muted small">
                    ${new Date(
                        l.timestamp
                    ).toLocaleString()}
                </td>

                <td>
                    <strong>
                        ${escapeHtml(
                            l.adminName
                        )}
                    </strong>
                </td>

                <td>
                    <span class="action-badge">
                        ${escapeHtml(
                            l.action
                        )}
                    </span>
                </td>

                <td>

                    ${
                        l.entityType
                        ? `
                            <span class="entity-badge">
                                ${escapeHtml(
                                    l.entityType
                                )}
                            </span>
                        `
                        : '-'
                    }

                </td>

                <td class="text-muted">
                    ${l.entityId ?? '-'}
                </td>

            </tr>

        `).join('')

        ||

        `
            <tr>
                <td
                    colspan="5"
                    class="text-center text-muted py-5">

                    <div style="font-size:35px;">
                        📋
                    </div>

                    <div class="mt-2">
                        No audit logs found.
                    </div>

                </td>
            </tr>
        `;
}

document
    .getElementById('searchBtn')
    .addEventListener(
        'click',
        loadLogs
    );

document
    .getElementById('filterAction')
    .addEventListener(
        'keydown',
        function(e) {

            if (e.key === 'Enter') {
                loadLogs();
            }

        }
    );

loadLogs();

</script>

</body>
</html>
