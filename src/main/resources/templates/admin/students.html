<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Students - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin/dashboard">Admin</a>
        <div>
            <a href="/admin/dashboard" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Manage Students</h2>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary" id="exportBtn">Export CSV</button>
            <button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#importModal">Import CSV</button>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#studentModal" onclick="openAddModal()">+ Add Student</button>
        </div>
    </div>

    <div id="alertBox" class="alert d-none"></div>

    <div class="row g-2 mb-3">
        <div class="col-md-4">
            <input type="text" class="form-control" id="searchQuery" placeholder="Search name, student ID, or email">
        </div>
        <div class="col-md-3">
            <input type="text" class="form-control" id="filterDepartment" placeholder="Department">
        </div>
        <div class="col-md-2">
            <input type="text" class="form-control" id="filterCourse" placeholder="Course">
        </div>
        <div class="col-md-2">
            <input type="text" class="form-control" id="filterYear" placeholder="Year">
        </div>
        <div class="col-md-1">
            <button class="btn btn-secondary w-100" id="searchBtn">Go</button>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover bg-white">
            <thead>
                <tr>
                    <th>Student ID</th><th>Name</th><th>Email</th><th>Department</th><th>Course</th><th>Year</th><th>Status</th><th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentsTableBody"></tbody>
        </table>
    </div>
</div>

<!-- Add/Edit Student Modal -->
<div class="modal fade" id="studentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="studentModalTitle">Add Student</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="studentForm">
                    <input type="hidden" id="editId">
                    <div class="mb-3">
                        <label class="form-label">Student ID</label>
                        <input type="text" class="form-control" id="studentId" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="row">
                        <div class="col-4 mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" class="form-control" id="department">
                        </div>
                        <div class="col-4 mb-3">
                            <label class="form-label">Course</label>
                            <input type="text" class="form-control" id="course">
                        </div>
                        <div class="col-4 mb-3">
                            <label class="form-label">Year</label>
                            <input type="text" class="form-control" id="year">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phoneNumber">
                    </div>
                    <p class="text-muted small" id="newStudentNote">New students are given the default password <strong>Student@123</strong> — ask them to change it after first login.</p>
                    <button type="submit" class="btn btn-primary w-100">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- CSV Import Modal -->
<div class="modal fade" id="importModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Import Students from CSV</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted small">CSV header: <code>student_id,name,email,department,course,year</code></p>
                <form id="importForm">
                    <input type="file" class="form-control mb-3" id="csvFile" accept=".csv" required>
                    <button type="submit" class="btn btn-primary w-100">Import</button>
                </form>
                <div id="importSummary" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script>
requireAuth('ROLE_ADMIN');

function showAlert(message, type) {
    const box = document.getElementById('alertBox');
    box.textContent = message;
    box.className = 'alert alert-' + type;
}

function statusBadge(status) {
    return status === 'ACTIVE' ? '<span class="badge bg-success">ACTIVE</span>' : '<span class="badge bg-secondary">' + status + '</span>';
}

async function loadStudents() {
    const params = new URLSearchParams({
        query: document.getElementById('searchQuery').value,
        department: document.getElementById('filterDepartment').value,
        course: document.getElementById('filterCourse').value,
        year: document.getElementById('filterYear').value
    });
    const res = await authFetch('/api/admin/students?' + params.toString());
    if (!res) return;
    const students = await res.json();

    const tbody = document.getElementById('studentsTableBody');
    tbody.innerHTML = students.map(s => `
        <tr>
            <td>${s.studentId}</td>
            <td>${s.fullName}</td>
            <td>${s.email}</td>
            <td>${s.department || ''}</td>
            <td>${s.course || ''}</td>
            <td>${s.year || ''}</td>
            <td>${statusBadge(s.status)}</td>
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick='openEditModal(${JSON.stringify(s)})'>Edit</button>
                ${s.status === 'ACTIVE'
                    ? `<button class="btn btn-sm btn-outline-danger" onclick="deactivate(${s.id})">Deactivate</button>`
                    : `<button class="btn btn-sm btn-outline-success" onclick="activate(${s.id})">Activate</button>`}
            </td>
        </tr>
    `).join('') || '<tr><td colspan="8" class="text-muted text-center">No students found.</td></tr>';
}

function openAddModal() {
    document.getElementById('studentModalTitle').textContent = 'Add Student';
    document.getElementById('studentForm').reset();
    document.getElementById('editId').value = '';
    document.getElementById('studentId').disabled = false;
    document.getElementById('newStudentNote').classList.remove('d-none');
}

function openEditModal(student) {
    document.getElementById('studentModalTitle').textContent = 'Edit Student';
    document.getElementById('editId').value = student.id;
    document.getElementById('studentId').value = student.studentId;
    document.getElementById('studentId').disabled = true; // Student ID is not editable, per spec
    document.getElementById('fullName').value = student.fullName;
    document.getElementById('email').value = student.email;
    document.getElementById('department').value = student.department || '';
    document.getElementById('course').value = student.course || '';
    document.getElementById('year').value = student.year || '';
    document.getElementById('phoneNumber').value = student.phoneNumber || '';
    document.getElementById('newStudentNote').classList.add('d-none');
    new bootstrap.Modal(document.getElementById('studentModal')).show();
}

async function activate(id) {
    const res = await authFetch(`/api/admin/students/${id}/activate`, { method: 'PATCH' });
    if (res && res.ok) { showAlert('Student activated.', 'success'); loadStudents(); }
}

async function deactivate(id) {
    if (!confirm('Deactivate this student account?')) return;
    const res = await authFetch(`/api/admin/students/${id}/deactivate`, { method: 'PATCH' });
    if (res && res.ok) { showAlert('Student deactivated.', 'success'); loadStudents(); }
}

document.getElementById('studentForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const editId = document.getElementById('editId').value;
    const body = {
        studentId: document.getElementById('studentId').value,
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        department: document.getElementById('department').value,
        course: document.getElementById('course').value,
        year: document.getElementById('year').value,
        phoneNumber: document.getElementById('phoneNumber').value
    };

    const url = editId ? `/api/admin/students/${editId}` : '/api/admin/students';
    const method = editId ? 'PUT' : 'POST';

    const res = await authFetch(url, { method, body: JSON.stringify(body) });
    if (!res) return;
    const data = await res.json();

    if (!res.ok) {
        showAlert(data.message || 'Failed to save student.', 'danger');
        return;
    }

    showAlert(editId ? 'Student updated.' : 'Student added.', 'success');
    bootstrap.Modal.getInstance(document.getElementById('studentModal')).hide();
    loadStudents();
});

document.getElementById('exportBtn').addEventListener('click', async function () {
    const token = localStorage.getItem('token');
    const res = await fetch('/api/admin/students/export', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) { showAlert('Export failed.', 'danger'); return; }
    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'students.csv';
    a.click();
    window.URL.revokeObjectURL(url);
});

document.getElementById('importForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const fileInput = document.getElementById('csvFile');
    if (!fileInput.files.length) return;

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    const token = localStorage.getItem('token');
    const res = await fetch('/api/admin/students/import', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: formData
    });
    const data = await res.json();

    if (!res.ok) {
        document.getElementById('importSummary').innerHTML = `<div class="alert alert-danger">${data.message || 'Import failed.'}</div>`;
        return;
    }

    document.getElementById('importSummary').innerHTML = `
        <div class="alert alert-info">
            Total: ${data.totalRecords} · Successful: ${data.successful} · Failed: ${data.failed} · Duplicates: ${data.duplicates}
            <br><small>${data.defaultPasswordNote}</small>
            ${data.errors && data.errors.length ? '<hr><small>' + data.errors.slice(0, 10).join('<br>') + '</small>' : ''}
        </div>
    `;
    loadStudents();
});

document.getElementById('searchBtn').addEventListener('click', loadStudents);

loadStudents();
</script>
</body>
</html>
