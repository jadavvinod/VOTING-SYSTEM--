<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Candidates - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin/dashboard">Admin</a>
        <div>
            <a href="/admin/elections" class="btn btn-outline-light btn-sm me-2">Elections</a>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h2 class="mb-3">Manage Positions & Candidates</h2>
    <div id="alertBox" class="alert d-none"></div>

    <div class="mb-3" style="max-width: 500px;">
        <label class="form-label">Election</label>
        <select id="electionSelect" class="form-select"></select>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h5>Add Position</h5>
            <form id="positionForm" class="d-flex gap-2">
                <input type="text" class="form-control" id="positionTitle" placeholder="e.g. President" required>
                <button type="submit" class="btn btn-primary text-nowrap">Add Position</button>
            </form>
        </div>
    </div>

    <div id="positionsContainer"></div>
</div>

<!-- Add Candidate Modal -->
<div class="modal fade" id="candidateModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Candidate</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="candidateForm">
                    <input type="hidden" id="candidatePositionId">
                    <div class="mb-3">
                        <label class="form-label">Student ID</label>
                        <input type="text" class="form-control" id="candidateStudentId" required>
                        <div class="form-text">The student must already have an account.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Slogan</label>
                        <input type="text" class="form-control" id="candidateSlogan">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Manifesto</label>
                        <textarea class="form-control" id="candidateManifesto" rows="4"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Photo (optional, JPG/PNG/WEBP, max 5MB)</label>
                        <input type="file" class="form-control" id="candidatePhoto" accept=".jpg,.jpeg,.png,.webp">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Add Candidate</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script>
requireAuth('ROLE_ADMIN');

function showAlert(message, type) {
    const box = document.getElementById('alertBox');
    box.textContent = message;
    box.className = 'alert alert-' + type;
}

function statusBadge(status) {
    const map = { PENDING: 'bg-secondary', APPROVED: 'bg-success', REJECTED: 'bg-danger', DISQUALIFIED: 'bg-dark' };
    return `<span class="badge ${map[status] || 'bg-secondary'}">${status}</span>`;
}

async function loadElections() {
    const res = await authFetch('/api/admin/elections');
    if (!res) return;
    const elections = await res.json();
    const select = document.getElementById('electionSelect');
    select.innerHTML = elections.map(e => `<option value="${e.id}">${e.name} (${e.status})</option>`).join('');
    select.addEventListener('change', loadPositions);
    if (elections.length > 0) loadPositions();
}

function currentElectionId() {
    return document.getElementById('electionSelect').value;
}

async function loadPositions() {
    const electionId = currentElectionId();
    if (!electionId) return;

    const res = await authFetch(`/api/admin/elections/${electionId}/positions`);
    if (!res) return;
    const positions = await res.json();

    const container = document.getElementById('positionsContainer');
    container.innerHTML = '';

    if (positions.length === 0) {
        container.innerHTML = '<p class="text-muted">No positions yet for this election.</p>';
        return;
    }

    for (const pos of positions) {
        const section = document.createElement('div');
        section.className = 'card mb-3';
        section.innerHTML = `
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">${pos.title}</h5>
                    <button class="btn btn-sm btn-outline-primary add-candidate-btn" data-position-id="${pos.id}">+ Add Candidate</button>
                </div>
                <div id="candidates-${pos.id}"></div>
            </div>
        `;
        container.appendChild(section);
        section.querySelector('.add-candidate-btn').addEventListener('click', function () {
            document.getElementById('candidatePositionId').value = this.getAttribute('data-position-id');
            document.getElementById('candidateForm').reset();
            document.getElementById('candidatePositionId').value = this.getAttribute('data-position-id');
            new bootstrap.Modal(document.getElementById('candidateModal')).show();
        });
        loadCandidatesForPosition(pos.id);
    }
}

async function loadCandidatesForPosition(positionId) {
    const electionId = currentElectionId();
    const res = await authFetch(`/api/admin/candidates/election/${electionId}`);
    if (!res) return;
    const all = await res.json();
    const candidates = all.filter(c => c.positionId == positionId);

    const target = document.getElementById('candidates-' + positionId);
    if (candidates.length === 0) {
        target.innerHTML = '<p class="text-muted small">No candidates yet.</p>';
        return;
    }

    target.innerHTML = candidates.map(c => `
        <div class="d-flex align-items-center justify-content-between border-bottom py-2">
            <div class="d-flex align-items-center gap-2">
                ${c.photoUrl ? `<img src="${c.photoUrl}" style="width:40px;height:40px;object-fit:cover;border-radius:50%;">` : ''}
                <div>
                    <strong>${c.fullName}</strong> (${c.studentId}) ${statusBadge(c.status)}
                    <br><span class="text-muted small">${c.slogan || ''}</span>
                </div>
            </div>
            <div class="d-flex gap-1">
                ${c.status !== 'APPROVED' ? `<button class="btn btn-sm btn-outline-success" onclick="approveCandidate(${c.id})">Approve</button>` : ''}
                ${c.status !== 'REJECTED' ? `<button class="btn btn-sm btn-outline-warning" onclick="rejectCandidate(${c.id})">Reject</button>` : ''}
                ${c.status !== 'DISQUALIFIED' ? `<button class="btn btn-sm btn-outline-dark" onclick="disqualifyCandidate(${c.id})">Disqualify</button>` : ''}
            </div>
        </div>
    `).join('');
}

async function approveCandidate(id) {
    const res = await authFetch(`/api/admin/candidates/${id}/approve`, { method: 'PATCH' });
    if (res && res.ok) { showAlert('Candidate approved.', 'success'); loadPositions(); }
}
async function rejectCandidate(id) {
    const res = await authFetch(`/api/admin/candidates/${id}/reject`, { method: 'PATCH' });
    if (res && res.ok) { showAlert('Candidate rejected.', 'success'); loadPositions(); }
}
async function disqualifyCandidate(id) {
    if (!confirm('Disqualify this candidate?')) return;
    const res = await authFetch(`/api/admin/candidates/${id}/disqualify`, { method: 'PATCH' });
    if (res && res.ok) { showAlert('Candidate disqualified.', 'success'); loadPositions(); }
}

document.getElementById('positionForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const electionId = currentElectionId();
    if (!electionId) return;

    const res = await authFetch(`/api/admin/elections/${electionId}/positions`, {
        method: 'POST',
        body: JSON.stringify({ title: document.getElementById('positionTitle').value })
    });
    if (!res) return;
    const data = await res.json();

    if (!res.ok) {
        showAlert(data.message || 'Failed to add position.', 'danger');
        return;
    }

    showAlert('Position added.', 'success');
    document.getElementById('positionForm').reset();
    loadPositions();
});

document.getElementById('candidateForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const positionId = document.getElementById('candidatePositionId').value;

    const res = await authFetch('/api/admin/candidates', {
        method: 'POST',
        body: JSON.stringify({
            studentId: document.getElementById('candidateStudentId').value,
            positionId: Number(positionId),
            slogan: document.getElementById('candidateSlogan').value,
            manifesto: document.getElementById('candidateManifesto').value
        })
    });
    if (!res) return;
    const data = await res.json();

    if (!res.ok) {
        showAlert(data.message || 'Failed to add candidate.', 'danger');
        return;
    }

    // If a photo was selected, upload it as a second step now that we have a candidate ID.
    const photoInput = document.getElementById('candidatePhoto');
    if (photoInput.files.length > 0) {
        const formData = new FormData();
        formData.append('file', photoInput.files[0]);
        const token = localStorage.getItem('token');
        await fetch(`/api/admin/candidates/${data.id}/photo`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token },
            body: formData
        });
    }

    showAlert('Candidate added.', 'success');
    bootstrap.Modal.getInstance(document.getElementById('candidateModal')).hide();
    loadPositions();
});

loadElections();
</script>
</body>
</html>
