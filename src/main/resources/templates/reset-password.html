<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="card shadow-sm" style="width: 400px;">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Reset Password</h3>
            <div id="alertBox" class="alert d-none"></div>
            <form id="resetForm">
                <div class="mb-3">
                    <label class="form-label">College Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">6-Digit Code</label>
                    <input type="text" class="form-control" id="otp" maxlength="6" required>
                    <div class="form-text">Codes expire after 5 minutes.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" id="newPassword" required minlength="8">
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirmNewPassword" required minlength="8">
                </div>
                <button type="submit" class="btn btn-primary w-100" id="submitBtn">Reset Password</button>
            </form>
            <p class="text-center mt-3 mb-0">
                <a href="/forgot-password">Didn't get a code? Request again</a>
            </p>
        </div>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const prefilledEmail = params.get('email');
if (prefilledEmail) document.getElementById('email').value = prefilledEmail;

document.getElementById('resetForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {
        const response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: document.getElementById('email').value,
                otp: document.getElementById('otp').value,
                newPassword: document.getElementById('newPassword').value,
                confirmNewPassword: document.getElementById('confirmNewPassword').value
            })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Something went wrong');

        alertBox.className = 'alert alert-success';
        alertBox.textContent = data.message + ' Redirecting to login...';
        alertBox.classList.remove('d-none');
        setTimeout(() => window.location.href = '/login', 1500);
    } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = err.message;
        alertBox.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
    }
});
</script>
</body>
</html>
