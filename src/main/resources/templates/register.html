<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Student Council Voting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="card shadow-sm" style="width: 480px;">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Student Registration</h3>
            <div id="errorAlert" class="alert alert-danger d-none"></div>
            <div id="successAlert" class="alert alert-success d-none">Registration successful! Redirecting to login...</div>
            <form id="registerForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Student ID</label>
                        <input type="text" class="form-control" id="studentId" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">College Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required minlength="8">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" required minlength="8">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control" id="department">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Course</label>
                        <input type="text" class="form-control" id="course">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Year</label>
                        <input type="text" class="form-control" id="year">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" class="form-control" id="phoneNumber">
                </div>
                <button type="submit" class="btn btn-primary w-100" id="submitBtn">Register</button>
            </form>
            <p class="text-center mt-3 mb-0">
                <a href="/login">Already have an account? Login</a>
            </p>
        </div>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');
    errorAlert.classList.add('d-none');
    successAlert.classList.add('d-none');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Registering...';

    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                studentId: document.getElementById('studentId').value,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value,
                department: document.getElementById('department').value,
                course: document.getElementById('course').value,
                year: document.getElementById('year').value,
                phoneNumber: document.getElementById('phoneNumber').value
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || 'Registration failed');
        }

        successAlert.classList.remove('d-none');
        setTimeout(() => window.location.href = '/login', 1500);
    } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register';
    }
});
</script>
</body>
</html>
